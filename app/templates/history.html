<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection History - Copper Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            color: #e94560;
            font-size: 1.8rem;
        }

        .back-btn {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #e94560;
            color: #fff;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }

        .stat-card .label {
            color: #888;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .stat-card.detected {
            border-top: 3px solid #4CAF50;
        }

        .stat-card.not-detected {
            border-top: 3px solid #f44336;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #e94560;
            border-color: #e94560;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #2196F3;
            border: none;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #1976D2;
        }

        .detections-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            color: #e94560;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-badge.detected {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status-badge.not-found {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .confidence-bar {
            width: 100px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: #e94560;
            border-radius: 4px;
        }

        .confidence-text {
            margin-top: 5px;
            font-size: 0.85rem;
            color: #888;
        }

        .camera-badge {
            padding: 5px 10px;
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
            border-radius: 5px;
            font-size: 0.85rem;
        }

        .image-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .image-thumb:hover {
            transform: scale(1.1);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            background: #e94560;
            border-color: #e94560;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(233, 69, 96, 0.3);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal for image preview */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .detections-table {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Detection History</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </header>

        <div class="stats-overview" id="statsOverview">
            <div class="stat-card">
                <div class="value" id="statTotal">-</div>
                <div class="label">Total Records</div>
            </div>
            <div class="stat-card detected">
                <div class="value" id="statDetected">-</div>
                <div class="label">Copper Found</div>
            </div>
            <div class="stat-card not-detected">
                <div class="value" id="statNotFound">-</div>
                <div class="label">Not Found</div>
            </div>
            <div class="stat-card">
                <div class="value" id="statAvgConf">-</div>
                <div class="label">Avg Confidence</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search detections...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="detected">Detected</button>
                <button class="filter-btn" data-filter="not-found">Not Found</button>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
        </div>

        <div class="detections-table">
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <table id="detectionsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Timestamp</th>
                        <th>Status</th>
                        <th>Count</th>
                        <th>Confidence</th>
                        <th>Camera</th>
                        <th>Image</th>
                    </tr>
                </thead>
                <tbody id="detectionsBody">
                </tbody>
            </table>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="icon">📭</div>
                <h3>No detections found</h3>
                <p>Start detecting to see history here</p>
            </div>
        </div>

        <div class="pagination">
            <button class="page-btn" id="prevBtn" disabled>← Previous</button>
            <span class="page-info" id="pageInfo">Page 1 of 1</span>
            <button class="page-btn" id="nextBtn" disabled>Next →</button>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <span class="modal-close" id="modalClose">×</span>
        <div class="modal-content">
            <img id="modalImage" alt="Detection Image">
        </div>
    </div>

    <script>
        // State
        let allDetections = [];
        let filteredDetections = [];
        let currentPage = 1;
        const pageSize = 20;
        let currentFilter = 'all';

        // DOM Elements
        const loading = document.getElementById('loading');
        const table = document.getElementById('detectionsTable');
        const tbody = document.getElementById('detectionsBody');
        const emptyState = document.getElementById('emptyState');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalClose = document.getElementById('modalClose');

        // Load detections
        async function loadDetections() {
            loading.style.display = 'block';
            table.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                const response = await fetch('/api/detections?limit=500');
                allDetections = await response.json();

                // Update stats
                updateStats();

                // Apply filter
                applyFilter();

            } catch (error) {
                console.error('Error loading detections:', error);
                loading.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }

        // Update stats
        function updateStats() {
            const total = allDetections.length;
            const detected = allDetections.filter(d => d.status === 'detected').length;
            const notFound = allDetections.filter(d => d.status !== 'detected').length;
            const avgConf = allDetections.length > 0
                ? (allDetections.reduce((sum, d) => sum + (d.confidence_avg || 0), 0) / allDetections.length * 100).toFixed(1)
                : 0;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statDetected').textContent = detected;
            document.getElementById('statNotFound').textContent = notFound;
            document.getElementById('statAvgConf').textContent = avgConf + '%';
        }

        // Apply filter
        function applyFilter() {
            const search = searchInput.value.toLowerCase();

            filteredDetections = allDetections.filter(d => {
                // Status filter
                if (currentFilter === 'detected' && d.status !== 'detected') return false;
                if (currentFilter === 'not-found' && d.status === 'detected') return false;

                // Search filter
                if (search) {
                    const searchable = `${d.status} ${d.detection_count} ${d.camera_source || ''}`.toLowerCase();
                    if (!searchable.includes(search)) return false;
                }

                return true;
            });

            currentPage = 1;
            renderTable();
        }

        // Render table
        function renderTable() {
            loading.style.display = 'none';

            if (filteredDetections.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';

            // Calculate pagination
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageItems = filteredDetections.slice(start, end);
            const totalPages = Math.ceil(filteredDetections.length / pageSize);

            // Update pagination
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

            // Render rows
            tbody.innerHTML = pageItems.map(det => {
                const statusClass = det.status === 'detected' ? 'detected' : 'not-found';
                const statusText = det.status === 'detected' ? 'Detected' : 'Not Found';
                const time = new Date(det.timestamp).toLocaleString();
                const confPercent = (det.confidence_avg * 100).toFixed(1);

                return `
                    <tr>
                        <td>#${det.id}</td>
                        <td>${time}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${det.detection_count}</td>
                        <td>
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confPercent}%"></div>
                            </div>
                            <div class="confidence-text">${confPercent}%</div>
                        </td>
                        <td>
                            ${det.camera_source ? `<span class="camera-badge">${det.camera_source}</span>` : '-'}
                        </td>
                        <td>
                            ${det.image_path ?
                                `<img src="${det.image_path}" class="image-thumb" onclick="showImage('${det.image_path}')" alt="Thumb">`
                                : '-'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Show image in modal
        function showImage(src) {
            modalImage.src = src;
            imageModal.classList.add('show');
        }

        // Event listeners
        refreshBtn.addEventListener('click', loadDetections);

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredDetections.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        searchInput.addEventListener('input', applyFilter);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilter();
            });
        });

        modalClose.addEventListener('click', () => {
            imageModal.classList.remove('show');
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('show');
            }
        });

        // Initial load
        loadDetections();

        // Auto refresh every 30 seconds
        setInterval(loadDetections, 30000);
    </script>
</body>
</html>
