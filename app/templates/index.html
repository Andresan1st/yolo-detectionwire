<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wire Branch Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --bg-primary: #0f1419;
      --bg-card: #1a1f26;
      --bg-input: #242b33;
      --text-primary: #e7e9ea;
      --text-secondary: #8899a6;
      --accent: #1d9bf0;
      --accent-green: #00ba7c;
      --accent-red: #f4212e;
      --border: #2f3943;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body { min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 28px; font-weight: 700; }
    .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
    .badge { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--bg-input); color: var(--text-secondary); }
    .badge.connected { background: rgba(0, 186, 124, 0.2); color: var(--accent-green); }
    .badge.disconnected { background: rgba(244, 33, 46, 0.2); color: var(--accent-red); }
    .card { border: 1px solid var(--border); border-radius: 16px; background: var(--bg-card); overflow: hidden; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .card-header h2 { font-size: 16px; font-weight: 600; }
    .card-body { position: relative; width: 100%; min-height: 400px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; }
    .card-footer { padding: 16px 20px; }
    .media-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #webcamVideo, #uploadCanvas { max-width: 100%; max-height: 100%; display: block; }
    #overlayCanvas, #uploadOverlay { position: absolute; pointer-events: none; width: 100%; height: 100%; }
    .upload-area { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-secondary); cursor: pointer; }
    .upload-area.dragover { background: rgba(0, 186, 124, 0.1); }
    .upload-area p { margin-bottom: 12px; }
    .upload-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    input[type="file"] { display: none; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button.primary { background: var(--accent-green); color: #000; }
    button.primary:hover { background: #00d68f; }
    button.secondary { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .stats { display: flex; align-items: center; gap: 12px; padding: 20px; background: var(--bg-input); border-radius: 12px; margin-bottom: 16px; }
    .number { font-size: 48px; font-weight: 800; color: var(--accent-green); line-height: 1; }
    .number-label { color: var(--text-secondary); font-size: 14px; }
    .message { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .message.info { background: rgba(29, 155, 240, 0.1); color: var(--accent); }
    .message.success { background: rgba(0, 186, 124, 0.1); color: var(--accent-green); }
    .message.error { background: rgba(244, 33, 46, 0.1); color: var(--accent-red); }
    .detections-panel { background: var(--bg-input); border-radius: 12px; padding: 16px; margin-top: 16px; display: none; }
    .detection-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .detection-item:last-child { border-bottom: none; }
    .detection-num { width: 28px; height: 28px; background: var(--accent-green); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
    .detection-info { flex: 1; }
    .detection-label { font-size: 14px; font-weight: 600; }
    .detection-meta { font-size: 12px; color: var(--text-secondary); }
    .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; gap: 20px; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 60px; height: 60px; border: 4px solid var(--border); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 18px; font-weight: 600; text-align: center; padding: 0 20px; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1001; }
    .popup-overlay.active { display: flex; }
    .popup { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; max-width: 400px; width: 90%; animation: popupIn 0.3s ease; }
    @keyframes popupIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .popup-icon { font-size: 64px; margin-bottom: 16px; }
    .popup-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .popup-message { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; line-height: 1.5; white-space: pre-line; }
    .popup-btn { padding: 12px 32px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent-green); color: #000; }
    .model-loading { color: #ff7a00; }
    .model-ready { color: var(--accent-green); }
    .model-error { color: var(--accent-red); }
    @media(max-width: 700px) {
      main { padding: 12px; }
      h1 { font-size: 22px; }
      .card-body { min-height: 280px; }
      .number { font-size: 36px; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🔌 Wire Branch Counter</h1>
      <p class="subtitle">Deteksi dan hitung kawat tembaga bercabang</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="badge" id="areaBadge">📍 Area: default</span>
      <span class="badge" id="status">Connecting...</span>
      <span class="badge" id="modelStatus">🤖 Model: Loading...</span>
    </div>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>📷 Webcam Live</h2>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="number" id="count" style="font-size:28px">0</span>
          <span class="number-label">terdeteksi</span>
        </div>
        <span id="liveIndicator" class="badge" style="display:none">● LIVE</span>
      </div>
    </div>
    <div class="card-body" id="inputStage">
      <div id="cameraContainer" style="display:none;position:relative;">
        <video id="webcamVideo" autoplay playsinline></video>
        <canvas id="overlayCanvas"></canvas>
      </div>
      <div id="uploadContainer" style="display:none;position:relative;">
        <canvas id="uploadCanvas"></canvas>
        <canvas id="uploadOverlay"></canvas>
      </div>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <p>Drag & drop gambar di sini</p>
        <small>atau klik "Pilih File"</small>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="card-footer">
      <div class="btn-group">
        <button class="secondary" id="uploadBtn" disabled>📁 Pilih File</button>
        <button class="secondary" id="stopCam" disabled>⏹ Berhenti</button>
        <button class="primary" id="startCam" disabled>🎥 Aktifkan Kamera</button>
        <button class="secondary" id="saveDbBtn" disabled style="background:var(--accent);color:#fff">💾 Simpan ke DB</button>
      </div>
      <div class="detections-panel" id="detectionsPanel">
        <div class="detections-header">📋 Detail Deteksi</div>
        <div id="detectionsList"></div>
      </div>
    </div>
  </div>

  <div class="message info" id="message">⏳ Memuat model AI...</div>
</main>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Memproses...</div>
</div>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <div class="popup-icon" id="popupIcon">✅</div>
    <div class="popup-title" id="popupTitle">Berhasil!</div>
    <div class="popup-message" id="popupMessage">Data berhasil disimpan.</div>
    <button class="popup-btn" id="popupBtn">OK</button>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const MODEL_URL = '/best.onnx';
const INPUT_SIZE = 1280;
const CONFIDENCE_THRESHOLD = 0.35;
const IOU_THRESHOLD = 0.45;
const CLASS_NAMES = ['element_copper'];
const API_URL = window.location.origin;

// Get area from URL
const pathParts = window.location.pathname.split('/').filter(Boolean);
const AREA = pathParts.length > 0 ? pathParts[0] : 'default';
document.getElementById('areaBadge').textContent = '📍 Area: ' + AREA;

// ==================== STATE ====================
let session = null;
let isModelReady = false;
let webcamStream = null;
let detectionLoop = null;
let lastDetectionCount = 0;
let isProcessing = false; // Prevent overlapping processing

// ==================== DOM ELEMENTS ====================
const webcamVideo = document.getElementById('webcamVideo');
const cameraContainer = document.getElementById('cameraContainer');
const uploadArea = document.getElementById('uploadArea');
const uploadCanvas = document.getElementById('uploadCanvas');
const uploadOverlay = document.getElementById('uploadOverlay');
const overlayCanvas = document.getElementById('overlayCanvas');
const uploadContainer = document.getElementById('uploadContainer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const startCam = document.getElementById('startCam');
const stopCam = document.getElementById('stopCam');
const saveDbBtn = document.getElementById('saveDbBtn');
const count = document.getElementById('count');
const message = document.getElementById('message');
const detectionsPanel = document.getElementById('detectionsPanel');
const detectionsList = document.getElementById('detectionsList');
const statusBadge = document.getElementById('status');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const modelStatus = document.getElementById('modelStatus');
const popupOverlay = document.getElementById('popupOverlay');
const popupIcon = document.getElementById('popupIcon');
const popupTitle = document.getElementById('popupTitle');
const popupMessage = document.getElementById('popupMessage');
const popupBtn = document.getElementById('popupBtn');

// ==================== UTILITIES ====================
function setMessage(text, type = 'info') {
  message.textContent = text;
  message.className = 'message ' + type;
}

function showLoading(text) {
  loadingText.textContent = text || 'Memproses...';
  loadingOverlay.classList.add('active');
}

function hideLoading() {
  loadingOverlay.classList.remove('active');
}

function closePopup() {
  popupOverlay.classList.remove('active');
}

function showPopup(icon, title, msg) {
  popupIcon.textContent = icon;
  popupTitle.textContent = title;
  popupMessage.textContent = msg;
  popupOverlay.classList.add('active');
}

popupBtn.onclick = closePopup;
popupOverlay.onclick = (e) => { if (e.target === popupOverlay) closePopup(); };

// ==================== HEALTH CHECK ====================
async function checkHealth() {
  try {
    const res = await fetch(API_URL + '/health');
    if (res.ok) {
      statusBadge.textContent = '● Connected';
      statusBadge.className = 'badge connected';
      return;
    }
  } catch {}
  statusBadge.textContent = '○ Disconnected';
  statusBadge.className = 'badge disconnected';
}
checkHealth();
setInterval(checkHealth, 10000);

// ==================== MODEL LOADING ====================
async function loadONNXModel() {
  modelStatus.textContent = '🤖 Model: Loading...';
  modelStatus.className = 'badge model-loading';
  startCam.disabled = true;
  uploadBtn.disabled = true;
  setMessage('⏳ Memuat model AI...', 'info');
  showLoading('🔍 Mengunduh model AI...');

  try {
    ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
    ort.env.wasm.loggingLevel = 'error';

    console.log('Loading ONNX model...');
    session = await ort.InferenceSession.create(MODEL_URL, {
      executionProviders: ['wasm', 'cpu']
    });

    isModelReady = true;
    modelStatus.textContent = '✅ Model Ready';
    modelStatus.className = 'badge model-ready';

    console.log('ONNX model loaded');
    console.log('Input names:', session.inputNames);
    console.log('Output names:', session.outputNames);

    startCam.disabled = false;
    uploadBtn.disabled = false;
    hideLoading();
    setMessage('✅ Model siap! Aktifkan kamera atau upload gambar.', 'success');
  } catch (error) {
    console.error('Model load error:', error);
    modelStatus.textContent = '❌ Model Error';
    modelStatus.className = 'badge model-error';
    hideLoading();
    setMessage('❌ Gagal memuat model: ' + error.message, 'error');
  }
}

// ==================== IMAGE PREPROCESSING ====================
// Pre-allocate tensor array for reuse (avoid GC)
const tensorBuffer = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Gagal membaca gambar'));
    img.src = src;
  });
}

// Optimized: accepts Image or Canvas directly
async function preprocessImage(source) {
  const canvas = document.createElement('canvas');
  canvas.width = INPUT_SIZE;
  canvas.height = INPUT_SIZE;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let srcWidth, srcHeight;

  if (source instanceof HTMLCanvasElement) {
    srcWidth = source.width;
    srcHeight = source.height;
  } else {
    srcWidth = source.width;
    srcHeight = source.height;
  }

  const scale = Math.min(INPUT_SIZE / srcWidth, INPUT_SIZE / srcHeight);
  const newWidth = srcWidth * scale;
  const newHeight = srcHeight * scale;
  const offsetX = (INPUT_SIZE - newWidth) / 2;
  const offsetY = (INPUT_SIZE - newHeight) / 2;

  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
  ctx.drawImage(source, offsetX, offsetY, newWidth, newHeight);

  const imageData = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
  const data = imageData.data;
  const pixelCount = INPUT_SIZE * INPUT_SIZE;

  // Optimized loop
  for (let i = 0; i < pixelCount; i++) {
    const idx = i * 4;
    tensorBuffer[i] = data[idx] / 255;
    tensorBuffer[pixelCount + i] = data[idx + 1] / 255;
    tensorBuffer[2 * pixelCount + i] = data[idx + 2] / 255;
  }

  return {
    tensor: new ort.Tensor('float32', tensorBuffer, [1, 3, INPUT_SIZE, INPUT_SIZE]),
    scale: { scale, offsetX, offsetY, origWidth: srcWidth, origHeight: srcHeight }
  };
}

// ==================== INFERENCE ====================
async function runInference(tensor) {
  if (!session || !isModelReady) return null;
  try {
    const feeds = { [session.inputNames[0]]: tensor };
    const results = await session.run(feeds);
    return results[session.outputNames[0]];
  } catch (error) {
    console.error('Inference error:', error);
    return null;
  }
}

// ==================== POSTPROCESSING ====================
function postprocessYOLO(output, scale, imgWidth, imgHeight) {
  const detections = [];
  const outputData = output.data;
  const dims = output.dims;

  if (dims.length !== 3) {
    console.error('Unexpected output shape:', dims);
    return detections;
  }

  const numValues = dims[1];
  const numPredictions = dims[2];
  const numClasses = numValues - 4;

  for (let i = 0; i < numPredictions; i++) {
    const x = outputData[i];
    const y = outputData[numPredictions + i];
    const w = outputData[numPredictions * 2 + i];
    const h = outputData[numPredictions * 3 + i];

    let maxScore = 0;
    let maxClass = 0;

    for (let c = 0; c < numClasses; c++) {
      const score = outputData[(4 + c) * numPredictions + i];
      if (score > maxScore) {
        maxScore = score;
        maxClass = c;
      }
    }

    if (maxScore < CONFIDENCE_THRESHOLD) continue;

    let x1 = (x - w / 2 - scale.offsetX) / scale.scale;
    let y1 = (y - h / 2 - scale.offsetY) / scale.scale;
    let x2 = (x + w / 2 - scale.offsetX) / scale.scale;
    let y2 = (y + h / 2 - scale.offsetY) / scale.scale;

    x1 = Math.max(0, Math.min(imgWidth, x1));
    y1 = Math.max(0, Math.min(imgHeight, y1));
    x2 = Math.max(0, Math.min(imgWidth, x2));
    y2 = Math.max(0, Math.min(imgHeight, y2));

    if (x2 <= x1 || y2 <= y1) continue;

    detections.push({
      class: maxClass,
      label: CLASS_NAMES[maxClass] || 'Class ' + maxClass,
      confidence: maxScore,
      bbox: [x1, y1, x2, y2]
    });
  }

  return applyNMS(detections, IOU_THRESHOLD);
}

function applyNMS(detections, iouThreshold) {
  if (detections.length === 0) return [];
  detections.sort((a, b) => b.confidence - a.confidence);
  const keep = [];

  for (const det of detections) {
    let shouldKeep = true;
    for (const selected of keep) {
      if (det.class !== selected.class) continue;
      const iou = calculateIOU(det.bbox, selected.bbox);
      if (iou > iouThreshold) {
        shouldKeep = false;
        break;
      }
    }
    if (shouldKeep) keep.push(det);
  }
  return keep;
}

function calculateIOU(box1, box2) {
  const [x1, y1, x2, y2] = box1;
  const [x3, y3, x4, y4] = box2;
  const interX1 = Math.max(x1, x3);
  const interY1 = Math.max(y1, y3);
  const interX2 = Math.min(x2, x4);
  const interY2 = Math.min(y2, y4);
  const interArea = Math.max(0, interX2 - interX1) * Math.max(0, interY2 - interY1);
  const box1Area = (x2 - x1) * (y2 - y1);
  const box2Area = (x4 - x3) * (y4 - y3);
  return interArea / (box1Area + box2Area - interArea);
}

// ==================== DRAW DETECTIONS ====================
function drawDetections(canvas, detections, nativeWidth, nativeHeight, displayWidth, displayHeight) {
  const ctx = canvas.getContext('2d');

  // Set canvas to display size (not native size)
  canvas.width = displayWidth;
  canvas.height = displayHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Calculate scale factor between native and display
  const scaleX = displayWidth / nativeWidth;
  const scaleY = displayHeight / nativeHeight;

  detections.forEach((det, i) => {
    // Scale coordinates from native to display size
    const x1 = det.bbox[0] * scaleX;
    const y1 = det.bbox[1] * scaleY;
    const x2 = det.bbox[2] * scaleX;
    const y2 = det.bbox[3] * scaleY;

    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 2;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const label = (i + 1) + '. ' + det.label + ' ' + (det.confidence * 100).toFixed(1) + '%';
    ctx.fillStyle = '#FF0000';
    ctx.font = 'bold 12px sans-serif';
    const textWidth = ctx.measureText(label).width;
    ctx.fillRect(x1, y1 - 18, textWidth + 8, 18);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(label, x1 + 4, y1 - 4);
  });
}

// ==================== RENDER DETECTIONS ====================
function renderDetections(detections) {
  if (!detections || detections.length === 0) {
    detectionsPanel.style.display = 'none';
    detectionsList.innerHTML = '';
    return;
  }

  detectionsList.innerHTML = detections.map((d, i) => {
    const pct = (d.confidence * 100).toFixed(1);
    return '<div class="detection-item">' +
      '<div class="detection-num">' + (i + 1) + '</div>' +
      '<div class="detection-info">' +
        '<div class="detection-label">' + d.label + '</div>' +
        '<div class="detection-meta">Confidence: ' + pct + '%</div>' +
      '</div>' +
    '</div>';
  }).join('');

  detectionsPanel.style.display = 'block';
}

// ==================== CAMERA ====================
startCam.onclick = async () => {
  if (!isModelReady) {
    setMessage('⏳ Model belum siap.', 'info');
    return;
  }
  try {
    webcamStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 }
    });
    webcamVideo.srcObject = webcamStream;

    cameraContainer.style.display = 'block';
    uploadContainer.style.display = 'none';
    uploadArea.style.display = 'none';

    startCam.disabled = true;
    stopCam.disabled = false;

    setMessage('✅ Kamera aktif. Mendeteksi...', 'success');

    await new Promise(resolve => { webcamVideo.onloadedmetadata = resolve; });

    detectLoop();
  } catch (error) {
    console.error('Camera error:', error);
    setMessage('❌ Gagal mengakses kamera: ' + error.message, 'error');
  }
};

stopCam.onclick = () => {
  if (detectionLoop) cancelAnimationFrame(detectionLoop);
  if (webcamStream) webcamStream.getTracks().forEach(track => track.stop());
  webcamStream = null;
  isProcessing = false;
  webcamVideo.srcObject = null;
  cameraContainer.style.display = 'none';
  uploadArea.style.display = 'flex';
  startCam.disabled = false;
  stopCam.disabled = true;
  overlayCanvas.getContext('2d').clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  setMessage('⏹ Kamera berhenti. Total: ' + lastDetectionCount + ' objek.', 'info');
};

async function detectLoop() {
  if (!webcamStream || isProcessing) {
    detectionLoop = requestAnimationFrame(detectLoop);
    return;
  }

  isProcessing = true;

  try {
    // Create temp canvas for capture
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = webcamVideo.videoWidth;
    tempCanvas.height = webcamVideo.videoHeight;
    const ctx = tempCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(webcamVideo, 0, 0);

    // Direct canvas preprocessing - no Image conversion needed!
    const { tensor, scale } = await preprocessImage(tempCanvas);
    const output = await runInference(tensor);

    if (output) {
      const detections = postprocessYOLO(output, scale, tempCanvas.width, tempCanvas.height);
      lastDetectionCount = detections.length;
      count.textContent = detections.length;

      // Get actual displayed dimensions
      const rect = webcamVideo.getBoundingClientRect();
      drawDetections(overlayCanvas, detections, tempCanvas.width, tempCanvas.height, rect.width, rect.height);

      if (detections.length > 0) {
        renderDetections(detections);
        saveDbBtn.disabled = false;
        setMessage('✅ ' + detections.length + ' objek terdeteksi', 'success');
      } else {
        detectionsPanel.style.display = 'none';
      }
    }
  } catch (e) {
    console.error('Detection error:', e);
  } finally {
    isProcessing = false;
  }

  detectionLoop = requestAnimationFrame(detectLoop);
}

// ==================== FILE UPLOAD ====================
uploadBtn.onclick = () => fileInput.click();
uploadArea.onclick = () => fileInput.click();

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (file) await processFile(file);
  fileInput.value = '';
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); };
uploadArea.ondragleave = () => uploadArea.classList.remove('dragover');
uploadArea.ondrop = async (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) await processFile(file);
};

async function processFile(file) {
  if (!isModelReady) {
    setMessage('⏳ Model belum siap.', 'info');
    return;
  }
  if (webcamStream) stopCam.click();

  showLoading('🔍 Menganalisis...');
  setMessage('⏳ Menganalisis...', 'info');

  try {
    const img = await loadImage(URL.createObjectURL(file));

    uploadCanvas.width = img.width;
    uploadCanvas.height = img.height;
    uploadCanvas.getContext('2d').drawImage(img, 0, 0);

    uploadOverlay.width = img.width;
    uploadOverlay.height = img.height;

    uploadContainer.style.display = 'block';
    uploadArea.style.display = 'none';

    const { tensor, scale } = await preprocessImage(img);
    const output = await runInference(tensor);

    if (output) {
      const detections = postprocessYOLO(output, scale, img.width, img.height);
      lastDetectionCount = detections.length;
      count.textContent = detections.length;

      // Get actual displayed dimensions
      const rect = uploadCanvas.getBoundingClientRect();
      drawDetections(uploadOverlay, detections, img.width, img.height, rect.width, rect.height);

      if (detections.length > 0) {
        renderDetections(detections);
        saveDbBtn.disabled = false;
        setMessage('✅ Deteksi berhasil! ' + detections.length + ' objek.', 'success');
      } else {
        detectionsPanel.style.display = 'none';
        setMessage('⚠️ Tidak ada objek terdeteksi.', 'warning');
      }
    }
  } catch (error) {
    console.error('Process error:', error);
    setMessage('❌ Error: ' + error.message, 'error');
  } finally {
    hideLoading();
  }
}

// ==================== SAVE TO DATABASE ====================
saveDbBtn.onclick = async () => {
  if (lastDetectionCount <= 0) {
    setMessage('⚠️ Tidak ada data untuk disimpan.', 'warning');
    return;
  }

  showLoading('💾 Menyimpan...');
  saveDbBtn.disabled = true;

  const now = new Date();
  const jakartaOffset = 7 * 60;
  const jakartaTime = new Date(now.getTime() + (now.getTimezoneOffset() + jakartaOffset) * 60000);
  const dt_ins = jakartaTime.toISOString().split('T')[0];
  const seq_time = jakartaTime.toISOString().replace('T', ' ').split('.')[0];

  try {
    const response = await fetch(API_URL + '/api/save-detection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ countc: lastDetectionCount, dt_ins, seq_time, area: AREA })
    });

    const result = await response.json();

    if (response.ok) {
      hideLoading();
      setMessage('✅ Tersimpan! ID: ' + result.id, 'success');
      showPopup('✅', 'Berhasil!', 'ID: ' + result.id + '\nJumlah: ' + result.count + '\nArea: ' + AREA + '\nWaktu: ' + seq_time);
    } else {
      hideLoading();
      setMessage('❌ Gagal menyimpan.', 'error');
      showPopup('❌', 'Gagal!', result.detail || 'Error tidak diketahui');
    }
  } catch (error) {
    hideLoading();
    setMessage('❌ Error: ' + error.message, 'error');
    showPopup('❌', 'Gagal!', 'Tidak dapat terhubung ke server.');
  } finally {
    saveDbBtn.disabled = lastDetectionCount <= 0;
  }
};

// ==================== INIT ====================
loadONNXModel();
</script>
