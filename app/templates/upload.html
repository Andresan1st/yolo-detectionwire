<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image - Copper Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            color: #e94560;
            font-size: 1.8rem;
        }

        .back-btn {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #e94560;
            color: #fff;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
        }

        .upload-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
        }

        .upload-panel h3 {
            color: #e94560;
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 2px dashed rgba(233, 69, 96, 0.5);
            border-radius: 15px;
            padding: 50px 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .drop-zone .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .drop-zone p {
            color: #888;
            margin-bottom: 10px;
        }

        .drop-zone .formats {
            font-size: 0.8rem;
            color: #666;
        }

        .file-input {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-upload {
            background: #e94560;
            color: #fff;
        }

        .btn-upload:hover {
            background: #d63850;
        }

        .btn-upload:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .preview-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
        }

        .preview-section h3 {
            color: #e94560;
            margin-bottom: 20px;
        }

        .image-preview {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 500px;
            display: none;
        }

        .image-preview.has-image img {
            display: block;
        }

        .image-preview .placeholder {
            color: #666;
            font-size: 1.2rem;
        }

        .results-panel {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
        }

        .results-panel h3 {
            color: #e94560;
            margin-bottom: 20px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result-item .value {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }

        .result-item .label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .result-item.detected {
            border: 2px solid #4CAF50;
        }

        .result-item.not-detected {
            border: 2px solid #f44336;
        }

        .result-image {
            background: #000;
            border-radius: 10px;
            padding: 10px;
        }

        .result-image img {
            width: 100%;
            border-radius: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(233, 69, 96, 0.3);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .file-info .name {
            font-weight: bold;
            color: #e94560;
            word-break: break-all;
        }

        .file-info .size {
            color: #888;
            margin-top: 5px;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-section h3 {
            color: #e94560;
            margin-bottom: 15px;
        }

        .history-list {
            display: grid;
            gap: 15px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item.detected {
            border-left: 3px solid #4CAF50;
        }

        .history-item.not-detected {
            border-left: 3px solid #f44336;
        }

        .history-info {
            flex: 1;
        }

        .history-info .time {
            font-size: 0.8rem;
            color: #888;
        }

        .history-info .stats {
            margin-top: 5px;
        }

        .history-image {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border-radius: 5px;
            display: none;
        }

        .history-image.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📤 Upload Image Detection</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </header>

        <div class="upload-section">
            <div class="upload-panel">
                <h3>📁 Select Image</h3>

                <div class="drop-zone" id="dropZone">
                    <div class="icon">🖼️</div>
                    <p>Drag & drop your image here</p>
                    <p>or click to browse</p>
                    <div class="formats">Supported: JPG, PNG, WEBP</div>
                </div>

                <input type="file" id="fileInput" class="file-input" accept="image/*">

                <button class="btn btn-upload" id="uploadBtn" disabled>
                    🔍 Detect Copper
                </button>

                <button class="btn btn-clear" id="clearBtn">
                    🗑️ Clear
                </button>

                <div class="file-info" id="fileInfo" style="display: none;">
                    <div class="name" id="fileName"></div>
                    <div class="size" id="fileSize"></div>
                </div>
            </div>

            <div class="preview-section">
                <h3>🖼️ Image Preview</h3>

                <div class="image-preview" id="imagePreview">
                    <span class="placeholder">No image selected</span>
                    <img id="previewImg" alt="Preview">
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing image...</p>
                </div>
            </div>
        </div>

        <div class="results-panel" id="resultsPanel" style="display: none;">
            <h3>📊 Detection Results</h3>

            <div class="results-grid">
                <div class="result-item" id="resultCount">
                    <div class="value">-</div>
                    <div class="label">Objects Found</div>
                </div>
                <div class="result-item" id="resultConfidence">
                    <div class="value">-</div>
                    <div class="label">Avg Confidence</div>
                </div>
                <div class="result-item" id="resultStatus">
                    <div class="value">-</div>
                    <div class="label">Status</div>
                </div>
                <div class="result-item" id="resultSaved">
                    <div class="value">-</div>
                    <div class="label">Record ID</div>
                </div>
            </div>

            <div class="result-image">
                <img id="resultImg" alt="Result">
            </div>
        </div>

        <div class="history-section" id="historySection">
            <h3>📋 Recent Uploads</h3>
            <div class="history-list" id="historyList">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const loading = document.getElementById('loading');
        const resultsPanel = document.getElementById('resultsPanel');
        const historyList = document.getElementById('historyList');

        let selectedFile = null;

        // Event Listeners
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        uploadBtn.addEventListener('click', uploadImage);
        clearBtn.addEventListener('click', clearSelection);

        // Handle file selection
        function handleFileSelect(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.classList.add('has-image');
                imagePreview.querySelector('.placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);

            // Show file info
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.style.display = 'block';

            // Enable upload button
            uploadBtn.disabled = false;

            // Hide previous results
            resultsPanel.style.display = 'none';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Upload and detect
        async function uploadImage() {
            if (!selectedFile) return;

            loading.classList.add('show');
            resultsPanel.style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/api/detect/image', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                loading.classList.remove('show');

                if (response.ok) {
                    showResults(result);
                    loadHistory();
                } else {
                    alert('Detection failed: ' + result.detail);
                }

            } catch (error) {
                loading.classList.remove('show');
                alert('Upload error: ' + error.message);
            }
        }

        // Show results
        function showResults(result) {
            resultsPanel.style.display = 'block';

            const countEl = document.getElementById('resultCount');
            const confEl = document.getElementById('resultConfidence');
            const statusEl = document.getElementById('resultStatus');
            const savedEl = document.getElementById('resultSaved');

            countEl.querySelector('.value').textContent = result.detections;
            confEl.querySelector('.value').textContent = (result.confidence_avg * 100).toFixed(1) + '%';
            statusEl.querySelector('.value').textContent = result.status === 'detected' ? 'Found' : 'Not Found';
            savedEl.querySelector('.value').textContent = result.saved_id || '-';

            // Add status classes
            countEl.className = 'result-item ' + (result.detections > 0 ? 'detected' : 'not-detected');
            statusEl.className = 'result-item ' + (result.status === 'detected' ? 'detected' : 'not-detected');

            // Show result image
            if (result.result_image) {
                document.getElementById('resultImg').src = result.result_image;
            }
        }

        // Clear selection
        function clearSelection() {
            selectedFile = null;
            fileInput.value = '';
            previewImg.src = '';
            imagePreview.classList.remove('has-image');
            imagePreview.querySelector('.placeholder').style.display = 'block';
            fileInfo.style.display = 'none';
            uploadBtn.disabled = true;
            resultsPanel.style.display = 'none';
        }

        // Load history
        async function loadHistory() {
            try {
                const response = await fetch('/api/detections?limit=10');
                const detections = await response.json();

                historyList.innerHTML = '';

                detections.slice(0, 5).forEach(det => {
                    const time = new Date(det.timestamp).toLocaleString();
                    const statusClass = det.status === 'detected' ? 'detected' : 'not-detected';
                    const statusText = det.status === 'detected' ? 'Found' : 'Not Found';

                    const item = document.createElement('div');
                    item.className = `history-item ${statusClass}`;
                    item.innerHTML = `
                        <div class="history-info">
                            <div><strong>${statusText}</strong> - ${det.detection_count} objects</div>
                            <div class="time">${time}</div>
                            <div class="stats">Confidence: ${(det.confidence_avg * 100).toFixed(1)}%</div>
                        </div>
                        ${det.image_path ? `<img src="${det.image_path}" class="history-image visible" alt="Result">` : ''}
                    `;
                    historyList.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Initial load
        loadHistory();
    </script>
</body>
</html>
