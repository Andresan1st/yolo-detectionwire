<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wire Branch Counter</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101416; color: #edf3ef; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 42px); }
    p { margin: 0; color: #aebbb4; }
    .badge { padding: 8px 12px; border-radius: 999px; background: #1b2923; color: #66e39f; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { overflow: hidden; border: 1px solid #29342f; border-radius: 16px; background: #171d1d; }
    .card h2 { margin: 0; padding: 16px 18px; font-size: 16px; }
    .stage { aspect-ratio: 16 / 10; background: #090d0d; display: grid; place-items: center; }
    video, #result { width: 100%; height: 100%; object-fit: contain; }
    #result { display: none; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
    button { border: 0; border-radius: 9px; padding: 11px 15px; color: #08130d; background: #66e39f; font-weight: 700; cursor: pointer; }
    button.secondary { color: #dbe9e0; background: #2a3631; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .stats { display: flex; align-items: center; gap: 12px; padding: 18px; border-top: 1px solid #29342f; }
    .number { color: #66e39f; font-size: 42px; font-weight: 800; line-height: 1; }
    #message { min-height: 22px; padding: 0 18px 16px; color: #f0c77b; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { display: block; } .badge { display: inline-block; margin-top: 14px; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Wire Branch Counter</h1><p>Deteksi dan hitung kawat tembaga yang bercabang dari webcam.</p></div><span class="badge">YOLO + Webcam</span></header>
  <section class="grid">
    <article class="card"><h2>Webcam PC user</h2><div class="stage"><video id="video" autoplay muted playsinline></video></div><div class="controls"><button id="start">Aktifkan kamera</button><button id="stop" class="secondary" disabled>Berhenti</button></div></article>
    <article class="card"><h2>Hasil deteksi</h2><div class="stage"><img id="result" alt="Hasil deteksi"></div><div class="stats"><span class="number" id="count">0</span><span>kawat bercabang terdeteksi</span></div><div id="message">Tekan “Aktifkan kamera” untuk mulai.</div></article>
  </section>
</main>
<script>
const video = document.querySelector('#video'), result = document.querySelector('#result');
const start = document.querySelector('#start'), stop = document.querySelector('#stop');
const count = document.querySelector('#count'), message = document.querySelector('#message');
const canvas = document.createElement('canvas'); let stream, timer, busy = false;
async function sendFrame() {
  if (busy || !stream || video.readyState < 2) return;
  busy = true; canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0); message.textContent = 'Menganalisis frame...';
  try {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .78));
    const form = new FormData(); form.append('file', blob, 'webcam.jpg');
    const response = await fetch('/api/detect', { method: 'POST', body: form });
    const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Deteksi gagal');
    if (!data.annotated_image) throw new Error('Server tidak mengembalikan gambar hasil deteksi.');
    result.src = `data:image/jpeg;base64,${data.annotated_image}`;
    result.style.display = 'block'; count.textContent = data.count;
    message.textContent = `Terakhir dianalisis: ${data.detections.length} objek.`;
  } catch (error) { message.textContent = error.message; }
  finally { busy = false; }
}
start.onclick = async () => { try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false}); video.srcObject = stream; start.disabled = true; stop.disabled = false; timer = setInterval(sendFrame, 700); } catch (error) { message.textContent = 'Kamera tidak bisa dibuka: ' + error.message; } };
stop.onclick = () => { clearInterval(timer); stream?.getTracks().forEach(track => track.stop()); stream = null; start.disabled = false; stop.disabled = true; message.textContent = 'Kamera berhenti.'; };
</script>
</body>
</html>
